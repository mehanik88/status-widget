name: Ad-hoc build (throwaway signature)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK (no repo secrets needed)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        # Same trim as the real release workflow: the action's default also
        # requests the legacy "tools" package, which Google no longer serves.
        packages: 'platform-tools'

    - name: Generate a throwaway signing key
      # app/build.gradle's release signingConfig requires *some* keystore file
      # to exist at build time (storeFile is not optional) — this is not the
      # maintainer's real key, just a one-time key so Gradle has something to
      # sign with. Re-sign the resulting APK with your own key afterwards
      # (e.g. apksigner) before distributing it anywhere.
      run: |
        keytool -genkeypair -v \
          -keystore keystore.jks \
          -alias key0 \
          -keyalg RSA -keysize 2048 -validity 3650 \
          -storepass adhocbuild -keypass adhocbuild \
          -dname "CN=adhoc,OU=adhoc,O=adhoc,L=adhoc,S=adhoc,C=US"

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build release APK
      env:
        KEY_PASSWORD: adhocbuild
      run: ./gradlew assembleGeelyRelease

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: status-widget-adhoc-apk
        path: app/build/outputs/apk/geely/release/*.apk
        retention-days: 14
